name: Fix Mushroom README update workflow

on:
  push:
    paths:
      - ".github/workflows/fix-update-mushroom-readmes.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make capability bullet detection language-neutral
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/update-mushroom-readmes.yml')
          text = path.read_text(encoding='utf-8')
          old = 'if line.lstrip().startswith(("* ", "- ")) and "Tile" in line),'
          new = 'if line.lstrip().startswith(("* ", "- "))),'
          if old not in text:
              raise SystemExit('target expression not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Remove temporary fixer
        run: rm .github/workflows/fix-update-mushroom-readmes.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Mushroom README update language-neutral"
          git push
