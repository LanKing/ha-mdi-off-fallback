name: Fix README word joiners

on:
  push:
    paths:
      - ".github/workflows/fix-word-joiners.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove unsupported word joiner entities
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('.').rglob('README*.md'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('&#8288;', '')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} README files')
          for path in changed:
              print(path)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-word-joiners.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fix language links in HACS"
          git push
