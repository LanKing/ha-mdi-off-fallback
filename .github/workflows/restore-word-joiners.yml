name: Restore README word joiners

on:
  push:
    paths:
      - ".github/workflows/restore-word-joiners.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore literal U+2060 word joiners
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source_commit = "4a20c2c9c805c705327d3877dd51512ea743bd91"
          changed = []

          for path in Path('.').rglob('README*.md'):
              rel = path.as_posix()
              try:
                  old = subprocess.check_output(
                      ["git", "show", f"{source_commit}:{rel}"],
                      text=True,
                      encoding="utf-8",
                  )
              except subprocess.CalledProcessError:
                  continue

              old_lines = old.splitlines(keepends=True)
              current = path.read_text(encoding="utf-8")
              current_lines = current.splitlines(keepends=True)
              if not old_lines or not current_lines:
                  continue

              restored_first_line = old_lines[0].replace("&#8288;", "\u2060")
              if current_lines[0] == restored_first_line:
                  continue

              current_lines[0] = restored_first_line
              path.write_text("".join(current_lines), encoding="utf-8")
              changed.append(rel)

          print(f"Updated {len(changed)} README files")
          for rel in changed:
              print(rel)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/restore-word-joiners.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Restore literal word joiners in language links"
          git push
