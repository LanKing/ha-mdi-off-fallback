name: Add Mushroom emoji to README files

on:
  push:
    paths:
      - ".github/workflows/add-mushroom-emoji.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add emoji before Mushroom Template Card
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [Path("README.md"), *sorted(Path("docs").glob("README_*.md"))]
          changed = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              new = text.replace("`Mushroom Template Card`", "🍄 `Mushroom Template Card`")
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  changed.append(str(path))

          print(f"Updated {len(changed)} README files")
          for path in changed:
              print(path)
          PY

      - name: Commit README changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README_*.md
          git commit -m "Add Mushroom icon to documentation" || exit 0
          git push
