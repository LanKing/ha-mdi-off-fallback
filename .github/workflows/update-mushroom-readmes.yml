name: Update Mushroom README documentation

on:
  push:
    paths:
      - ".github/workflows/update-mushroom-readmes.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update all README translations
        run: |
          python - <<'PY'
          from pathlib import Path

          notes = {
            "README.md": "* also supports `Mushroom Template Card`; the card must have an `entity` configured so the plugin can determine its state;",
            "uk": "* також підтримує `Mushroom Template Card`; у картці має бути вказано `entity`, щоб плагін міг визначати її стан;",
            "ru": "* также поддерживает `Mushroom Template Card`; в карточке должна быть указана `entity`, чтобы плагин мог определять её состояние;",
            "af": "* ondersteun ook `Mushroom Template Card`; die kaart moet 'n `entity` hê sodat die inprop die toestand daarvan kan bepaal;",
            "ar": "* يدعم أيضًا `Mushroom Template Card`؛ ويجب تحديد `entity` في البطاقة حتى يتمكن الملحق من تحديد حالتها؛",
            "bg": "* поддържа и `Mushroom Template Card`; в картата трябва да е зададен `entity`, за да може плъгинът да определя състоянието ѝ;",
            "bn": "* `Mushroom Template Card`-ও সমর্থন করে; প্লাগইন যাতে এর অবস্থা নির্ধারণ করতে পারে, কার্ডে অবশ্যই একটি `entity` নির্ধারিত থাকতে হবে;",
            "bs": "* podržava i `Mushroom Template Card`; kartica mora imati postavljen `entity` kako bi dodatak mogao odrediti njeno stanje;",
            "ca": "* també admet `Mushroom Template Card`; la targeta ha de tenir un `entity` configurat perquè el connector pugui determinar-ne l'estat;",
            "cs": "* podporuje také `Mushroom Template Card`; karta musí mít nastavené `entity`, aby plugin mohl určit její stav;",
            "cy": "* mae hefyd yn cefnogi `Mushroom Template Card`; rhaid i'r cerdyn gynnwys `entity` fel y gall yr ategyn bennu ei gyflwr;",
            "da": "* understøtter også `Mushroom Template Card`; kortet skal have en `entity` angivet, så pluginet kan bestemme dets tilstand;",
            "de": "* unterstützt auch `Mushroom Template Card`; für die Karte muss eine `entity` angegeben sein, damit das Plugin ihren Zustand bestimmen kann;",
            "el": "* υποστηρίζει επίσης `Mushroom Template Card`· η κάρτα πρέπει να έχει ορισμένο `entity`, ώστε το πρόσθετο να μπορεί να προσδιορίζει την κατάστασή της;",
            "eo": "* ankaŭ subtenas `Mushroom Template Card`; la karto devas havi agorditan `entity`, por ke la kromprogramo povu determini ĝian staton;",
            "es": "* también admite `Mushroom Template Card`; la tarjeta debe tener una `entity` configurada para que el complemento pueda determinar su estado;",
            "et": "* toetab ka `Mushroom Template Card`-i; kaardil peab olema määratud `entity`, et plugin saaks selle oleku tuvastada;",
            "eu": "* `Mushroom Template Card` ere onartzen du; txartelak `entity` bat zehaztuta izan behar du pluginak haren egoera zehaztu ahal izateko;",
            "fa": "* از `Mushroom Template Card` نیز پشتیبانی می‌کند؛ کارت باید یک `entity` مشخص داشته باشد تا افزونه بتواند وضعیت آن را تشخیص دهد؛",
            "fi": "* tukee myös `Mushroom Template Card` -korttia; kortille on määritettävä `entity`, jotta lisäosa voi määrittää sen tilan;",
            "fy": "* stipet ek `Mushroom Template Card`; de kaart moat in `entity` ynsteld hawwe, sadat de plugin de steat bepale kin;",
            "fr": "* prend également en charge `Mushroom Template Card` ; la carte doit avoir une `entity` configurée afin que le plugin puisse déterminer son état ;",
            "ga": "* tacaíonn sé freisin le `Mushroom Template Card`; ní mór `entity` a bheith socraithe ar an gcárta ionas gur féidir leis an mbreiseán a staid a chinneadh;",
            "gl": "* tamén admite `Mushroom Template Card`; a tarxeta debe ter unha `entity` configurada para que o complemento poida determinar o seu estado;",
            "gsw": "* unterstützt au `Mushroom Template Card`; d Charte muess e `entity` definiert ha, damit s Plugin dr Zustand cha bestimme;",
            "he": "* תומך גם ב-`Mushroom Template Card`; בכרטיס חייב להיות מוגדר `entity` כדי שהתוסף יוכל לקבוע את מצבו;",
            "hi": "* `Mushroom Template Card` का भी समर्थन करता है; प्लगइन उसकी स्थिति निर्धारित कर सके, इसके लिए कार्ड में `entity` सेट होना चाहिए;",
            "hr": "* podržava i `Mushroom Template Card`; kartica mora imati postavljen `entity` kako bi dodatak mogao odrediti njezino stanje;",
            "hu": "* a `Mushroom Template Card` kártyát is támogatja; a kártyán meg kell adni egy `entity` értéket, hogy a bővítmény meg tudja határozni az állapotát;",
            "hy": "* աջակցում է նաև `Mushroom Template Card`-ին․ քարտում պետք է նշված լինի `entity`, որպեսզի փլագինը կարողանա որոշել դրա վիճակը;",
            "id": "* juga mendukung `Mushroom Template Card`; kartu harus memiliki `entity` agar plugin dapat menentukan statusnya;",
            "is": "* styður einnig `Mushroom Template Card`; kortið verður að hafa `entity` skilgreint svo viðbótin geti ákvarðað stöðu þess;",
            "it": "* supporta anche `Mushroom Template Card`; la scheda deve avere una `entity` configurata affinché il plugin possa determinarne lo stato;",
            "ja": "* `Mushroom Template Card` にも対応します。プラグインが状態を判定できるよう、カードには `entity` を指定する必要があります;",
            "ka": "* ასევე უჭერს მხარს `Mushroom Template Card`-ს; ბარათში უნდა იყოს მითითებული `entity`, რათა პლაგინმა მისი მდგომარეობის განსაზღვრა შეძლოს;",
            "ko": "* `Mushroom Template Card`도 지원합니다. 플러그인이 상태를 판단할 수 있도록 카드에 `entity`를 지정해야 합니다;",
            "lb": "* ënnerstëtzt och `Mushroom Template Card`; d'Kaart muss eng `entity` definéiert hunn, fir datt de Plugin hire Status bestëmme kann;",
            "lt": "* taip pat palaiko `Mushroom Template Card`; kortelėje turi būti nurodytas `entity`, kad papildinys galėtų nustatyti jos būseną;",
            "lv": "* atbalsta arī `Mushroom Template Card`; kartē jābūt norādītam `entity`, lai spraudnis varētu noteikt tās stāvokli;",
            "mk": "* поддржува и `Mushroom Template Card`; картичката мора да има зададено `entity` за приклучокот да може да ја одреди нејзината состојба;",
            "ml": "* `Mushroom Template Card`-ഉം പിന്തുണയ്ക്കുന്നു; പ്ലഗിന് അതിന്റെ അവസ്ഥ നിർണ്ണയിക്കാനായി കാർഡിൽ `entity` നിർബന്ധമായും നൽകിയിരിക്കണം;",
            "nb": "* støtter også `Mushroom Template Card`; kortet må ha en `entity` angitt slik at programtillegget kan fastslå tilstanden;",
            "nl": "* ondersteunt ook `Mushroom Template Card`; de kaart moet een `entity` hebben zodat de plugin de status ervan kan bepalen;",
            "nn": "* støttar òg `Mushroom Template Card`; kortet må ha ein `entity` angitt slik at programtillegget kan fastslå tilstanden;",
            "pl": "* obsługuje również `Mushroom Template Card`; karta musi mieć ustawione `entity`, aby wtyczka mogła określić jej stan;",
            "pt": "* também suporta `Mushroom Template Card`; o cartão deve ter uma `entity` configurada para que o plugin possa determinar o seu estado;",
            "pt-BR": "* também oferece suporte a `Mushroom Template Card`; o cartão deve ter uma `entity` configurada para que o plugin possa determinar seu estado;",
            "ro": "* acceptă și `Mushroom Template Card`; cardul trebuie să aibă o `entity` configurată pentru ca pluginul să îi poată determina starea;",
            "sk": "* podporuje aj `Mushroom Template Card`; karta musí mať nastavené `entity`, aby plugin mohol určiť jej stav;",
            "sl": "* podpira tudi `Mushroom Template Card`; kartica mora imeti nastavljen `entity`, da lahko vtičnik določi njeno stanje;",
            "sq": "* mbështet gjithashtu `Mushroom Template Card`; karta duhet të ketë të përcaktuar një `entity` që shtojca të mund të përcaktojë gjendjen e saj;",
            "sr": "* подржава и `Mushroom Template Card`; картица мора имати подешен `entity` како би додатак могао да одреди њено стање;",
            "sr-Latn": "* podržava i `Mushroom Template Card`; kartica mora imati podešen `entity` kako bi dodatak mogao da odredi njeno stanje;",
            "sv": "* stöder även `Mushroom Template Card`; kortet måste ha en `entity` angiven så att pluginet kan avgöra dess tillstånd;",
            "ta": "* `Mushroom Template Card`-ஐயும் ஆதரிக்கிறது; பிளகின் அதன் நிலையைத் தீர்மானிக்க, கார்டில் `entity` குறிப்பிடப்பட்டிருக்க வேண்டும்;",
            "te": "* `Mushroom Template Card`-కు కూడా మద్దతు ఇస్తుంది; ప్లగిన్ దాని స్థితిని నిర్ణయించడానికి కార్డులో `entity` తప్పనిసరిగా ఇవ్వాలి;",
            "th": "* รองรับ `Mushroom Template Card` ด้วย โดยการ์ดต้องกำหนด `entity` เพื่อให้ปลั๊กอินสามารถตรวจสอบสถานะได้;",
            "tr": "* `Mushroom Template Card` desteği de vardır; eklentinin durumunu belirleyebilmesi için kartta bir `entity` tanımlanmış olmalıdır;",
            "ur": "* `Mushroom Template Card` کو بھی سپورٹ کرتا ہے؛ پلگ اِن کو اس کی حالت معلوم کرنے کے لیے کارڈ میں `entity` مقرر ہونا ضروری ہے؛",
            "vi": "* cũng hỗ trợ `Mushroom Template Card`; thẻ phải được cấu hình `entity` để plugin có thể xác định trạng thái của thẻ;",
            "zh-Hans": "* 也支持 `Mushroom Template Card`；卡片必须配置 `entity`，插件才能判断其状态；",
            "zh-Hant": "* 也支援 `Mushroom Template Card`；卡片必須設定 `entity`，外掛才能判斷其狀態；",
          }

          paths = [Path("README.md"), *sorted(Path("docs").glob("README_*.md"))]
          changed = []

          for path in paths:
            key = "README.md" if path.name == "README.md" else path.stem.removeprefix("README_")
            note = notes.get(key)
            if note is None:
              raise SystemExit(f"Missing translation for {path}")

            text = path.read_text(encoding="utf-8")
            if "Mushroom Template Card" in text:
              continue

            lines = text.splitlines(keepends=True)
            tile_index = next(
              (i for i, line in enumerate(lines)
               if line.lstrip().startswith(("* ", "- ")) and "Tile" in line),
              None,
            )
            if tile_index is None:
              raise SystemExit(f"Tile capability bullet not found in {path}")

            newline = "\r\n" if lines[tile_index].endswith("\r\n") else "\n"
            lines.insert(tile_index + 1, note + newline)
            path.write_text("".join(lines), encoding="utf-8", newline="")
            changed.append(str(path))

          print(f"Updated {len(changed)} README files")
          for path in changed:
            print(path)
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/update-mushroom-readmes.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Document Mushroom Template Card support"
          git push
