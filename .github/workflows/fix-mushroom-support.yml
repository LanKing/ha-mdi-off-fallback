name: Fix Mushroom Template support

on:
  push:
    paths:
      - ".github/workflows/fix-mushroom-support.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix plugin
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('ha-mdi-off-fallback.js')
          text = path.read_text(encoding='utf-8')
          bad = '  const getTileStateContext = (tileIcon) => {\n    const context = getTileStateContext(tileIcon);\n    const domain = context?.domain;\n    const state = context?.state;\n    if (domain && state) return { domain, state };\n'
          good = '  const getTileStateContext = (tileIcon) => {\n    const domain = tileIcon.getAttribute("data-domain");\n    const state = tileIcon.getAttribute("data-state");\n    if (domain && state) return { domain, state };\n'
          assert bad in text, 'bad getTileStateContext block not found'
          text = text.replace(bad, good, 1)
          old = '  const processTileIcon = (tileIcon) => {\n    const domain = tileIcon.getAttribute("data-domain");\n    const state = tileIcon.getAttribute("data-state");\n'
          new = '  const processTileIcon = (tileIcon) => {\n    const context = getTileStateContext(tileIcon);\n    const domain = context?.domain;\n    const state = context?.state;\n'
          assert old in text, 'processTileIcon block not found'
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/fix-mushroom-support.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Fix Mushroom Template state resolution"
          git push
