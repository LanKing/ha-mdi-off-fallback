name: Add Mushroom Template support

on:
  push:
    paths:
      - ".github/workflows/add-mushroom-template-support.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update plugin
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path("ha-mdi-off-fallback.js")
          text = path.read_text(encoding="utf-8")
          text = text.replace(" * v0.2.9\n", " * v0.2.11\n", 1)
          text = text.replace('const VERSION = "0.2.9";', 'const VERSION = "0.2.11";', 1)
          text = text.replace('  let maskSequence = 0;\n', '  let maskSequence = 0;\n  const trackedMushroomEntities = new Set();\n  const mushroomEntityStates = new Map();\n  let mushroomStateSubscriptionStarted = false;\n', 1)
          text = text.replace('    return { svgRoot, svg, path };', '    return { stateIcon, svgRoot, svg, path };', 1)
          text = text.replace('    const { svgRoot, svg, path } = getIconDetails(tileIcon);', '    const { stateIcon, svgRoot, svg, path } = getIconDetails(tileIcon);', 1)
          text = text.replace('      tileIcon.querySelector("ha-state-icon")?.getAttribute("icon") ??\n', '      stateIcon?.icon ??\n      stateIcon?.getAttribute("icon") ??\n', 1)

          helper = base64.b64decode('').decode('utf-8')
          marker = '  const processTileIcon = (tileIcon) => {\n'
          assert marker in text, 'processTileIcon marker not found'
          text = text.replace(marker, helper + marker, 1)
          text = text.replace('    const domain = tileIcon.getAttribute("data-domain");\n    const state = tileIcon.getAttribute("data-state");\n', '    const context = getTileStateContext(tileIcon);\n    const domain = context?.domain;\n    const state = context?.state;\n', 1)

          assert 'const VERSION = "0.2.11";' in text
          assert 'findMushroomTemplateCard' in text
          assert 'getTileStateContext' in text
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/add-mushroom-template-support.yml

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add Mushroom Template Card support"
          git push
