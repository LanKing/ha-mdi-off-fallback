name: Convert language links to absolute URLs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/absolute-language-links.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert language rubricator links
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          base = 'https://github.com/LanKing/ha-mdi-off-fallback/blob/main/'
          paths = [Path('README.md'), *sorted(Path('docs').glob('README_*.md'))]
          changed = []

          for path in paths:
              text = path.read_text(encoding='utf-8')
              lines = text.splitlines(keepends=True)
              if not lines:
                  continue

              first = lines[0]
              first = first.lstrip('+')

              def replace_href(match):
                  href = match.group(1)
                  if href.startswith('https://') or href.startswith('http://'):
                      return match.group(0)

                  normalized = href.lstrip('./')
                  if normalized.startswith('docs/'):
                      target = normalized
                  elif normalized == 'README.md':
                      target = 'README.md'
                  elif normalized.startswith('README_'):
                      target = 'docs/' + normalized
                  elif href.startswith('/docs/'):
                      target = href.lstrip('/')
                  else:
                      return match.group(0)

                  return f'href="{base}{target}"'

              first = re.sub(r'href="([^"]+)"', replace_href, first)
              new_text = first + ''.join(lines[1:])

              if new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Changed {len(changed)} README files')
          for path in changed:
              print(path)
          PY

      - name: Commit README link updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README_*.md
          git commit -m "Use absolute links in language rubricators"
          git pull --rebase origin main
          git push
